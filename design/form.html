<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Overpass:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Frontend Mentor | Contact form</title>

</head>

<body>

    <div class="form_container">

        <form class="form" action="">

            <h1 class="contact_us">Contact Us</h1>

            <div class="first_last_name">

                <div class="input_group">
                    <label class="first_name" for="first_name">First Name <b>*</b></label>
                    <input type="text" id="first_name">
                    <!-- This field is required -->
                </div>

                <div class="input_group">
                    <label class="last_name" for="last_name">Last Name <b>*</b></label>
                    <input type="text" id="last_name">
                    <!-- This field is required -->
                </div>

            </div>

            <div class="input_group">
                <label for="email_address">Email Address <b>*</b></label>
                <input type="text" id="email_address">
            </div>

            <!-- Please enter a valid email address -->
            <!-- This field is required -->

            <label class="query_type">Query Type <b>*</b></label>

            <div class="segments">

                <div class="radio_input">
                    <label for="general_enquiry">
                        <input name="query_type" type="radio" id="general_enquiry">
                        General Enquiry</label>
                </div>

                <div class="radio_input">
                    <label for="support_request"><input name="query_type" type="radio" id="support_request">
                        Support Request</label>
                </div>
                <!-- Please select a query type -->
            </div>

            <label class="message" for="message">Message <b>*</b></label>
            <!-- This field is required -->
            <textarea rows="4" cols="50" id="message" name="message"></textarea>

            <div class="agrement">
                <input class="checkbox" type="checkbox">
                <p> I consent to being contacted by the team <b>*</b></p>
            </div>
            <!-- To submit this form, please consent to being contacted -->

            <button class="submit_button" id="submit_button" type="submit">Submit</button>

            <!-- Message Sent!
            Thanks for completing the form. We'll be in touch soon! -->
    </div>

    </form>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io/challenges/contact-form--G-hYlqKJj" target="_blank">Frontend
            Mentor</a>
        Coded by <a href="https://github.com/andreslondono00/contact-form" target="_blank">Andrés Londoño</a>
    </footer>

    <script type="text/javascript" src="./js/form.js"></script>

</body>

</html>
